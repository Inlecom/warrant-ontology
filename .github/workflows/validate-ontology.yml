name: Validate WARRaNT Ontology

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Turtle Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rdflib and pySHACL
        run: pip install rdflib pyshacl

      - name: Validate Turtle syntax, namespace usage and SHACL shapes
        run: python scripts/validate_turtle.py --shacl

      - name: Check module documentation is up to date
        run: python scripts/generate_module_docs.py --check

      - name: Build merged ontology (CI artefact check)
        run: python scripts/merge_ontology.py
